# DD-F-02  Service map, generation 1 (seed part 5, DM-R-54 structure; file format SL-O-11 is Round 5).
# Resolves PM-O-02 (values). Every name and host is invented (SL-DR-01); services are named by function (SB-D-06).
# "A depends on B" means A needs B to work (DM-E-28). A component with runs_on depends on that server (DM-E28-R2).

services:                             # DM-E-25 (complete list, 4)
  - {service_key: svc-balance-check,     name: "Balance Check (USSD)", criticality: critical, owner_team_key: vas-service-owners, component_keys: [ussd-gw, api-balance, db-subscriber]}
  - {service_key: svc-bundle-purchase,   name: "Bundle Purchase",      criticality: critical, owner_team_key: vas-service-owners, component_keys: [ussd-gw, api-bundle, db-subscriber]}
  - {service_key: svc-sms-notifications, name: "SMS Notifications",    criticality: high,     owner_team_key: vas-service-owners, component_keys: [sms-queue]}
  - {service_key: svc-mgmt-reports,      name: "Management Reports",                          owner_team_key: it-apps,            component_keys: [report-export]}   # no criticality: readiness gap (SL-A2-01)

components:                           # DM-E-26 (complete list, 12)
  # servers
  - {component_key: srv-db-01,    name: "Subscriber DB server",   kind: server, criticality: critical, owner_team_key: db-ops,   target_key: lab-db-01}
  - {component_key: srv-api-01,   name: "Charging API server",    kind: server, criticality: high,     owner_team_key: it-infra}
  - {component_key: srv-vas-01,   name: "VAS platform server",    kind: server, criticality: high,     owner_team_key: it-infra}
  - {component_key: srv-probe-01, name: "Synthetic probe server", kind: server, criticality: medium,   owner_team_key: it-infra}
  - {component_key: srv-rpt-01,   name: "Reporting server",       kind: server, criticality: low}                                   # no owner: readiness gap (SL-A2-01)
  # applications, database, queue, check
  - {component_key: db-subscriber, name: "Subscriber database",     kind: database,    criticality: critical, owner_team_key: db-ops,  runs_on_key: srv-db-01}
  - {component_key: api-balance,   name: "Balance-check API",       kind: application, criticality: critical, owner_team_key: it-apps, runs_on_key: srv-api-01}
  - {component_key: api-bundle,    name: "Bundle-purchase API",     kind: application, criticality: critical, owner_team_key: it-apps, runs_on_key: srv-api-01}
  - {component_key: ussd-gw,       name: "USSD gateway",            kind: application, criticality: critical, owner_team_key: vas-ops, runs_on_key: srv-vas-01}
  - {component_key: sms-queue,     name: "SMS queue",               kind: queue,       criticality: high,     owner_team_key: vas-ops, runs_on_key: srv-vas-01}
  - {component_key: ussd-probe,    name: "Synthetic USSD sessions", kind: check,       criticality: medium,   owner_team_key: noc-l1,  runs_on_key: srv-probe-01}
  - {component_key: report-export, name: "Report export job",       kind: application, criticality: low,      owner_team_key: it-apps, runs_on_key: srv-rpt-01}

identity_keys:                        # DM-E-27 (complete list, 15). Key names: DD-ASM-01 (connector fact check, DM-O-04).
  # Zabbix: precedence [component, host]. "component" is the value of the Zabbix event tag "component".
  - {component_key: srv-db-01,     source_kind: zabbix, name: component, value: srv-db-01}
  - {component_key: db-subscriber, source_kind: zabbix, name: component, value: db-subscriber}
  - {component_key: sms-queue,     source_kind: zabbix, name: component, value: sms-queue}
  - {component_key: report-export, source_kind: zabbix, name: component, value: report-export}
  - {component_key: srv-db-01,     source_kind: zabbix, name: host,      value: lab-db-01}
  - {component_key: srv-api-01,    source_kind: zabbix, name: host,      value: lab-api-01}
  - {component_key: srv-vas-01,    source_kind: zabbix, name: host,      value: lab-vas-01}
  - {component_key: srv-probe-01,  source_kind: zabbix, name: host,      value: lab-probe-01}
  - {component_key: srv-rpt-01,    source_kind: zabbix, name: host,      value: lab-rpt-01}
  # Alertmanager: precedence [component, instance]. "component" is the alert label "component".
  - {component_key: srv-db-01,     source_kind: alertmanager, name: component, value: srv-db-01}
  - {component_key: api-balance,   source_kind: alertmanager, name: component, value: api-balance}
  - {component_key: api-bundle,    source_kind: alertmanager, name: component, value: api-bundle}
  - {component_key: ussd-gw,       source_kind: alertmanager, name: component, value: ussd-gw}
  - {component_key: ussd-probe,    source_kind: alertmanager, name: component, value: ussd-probe}
  - {component_key: srv-db-01,     source_kind: alertmanager, name: instance,  value: "lab-db-01:9100"}

dependencies:                         # DM-E-28 (complete list, 6; runs_on dependencies are implied, DM-E28-R2)
  - {from_component_key: api-balance, to_component_key: db-subscriber}
  - {from_component_key: api-bundle,  to_component_key: db-subscriber}
  - {from_component_key: sms-queue,   to_component_key: db-subscriber}
  - {from_component_key: ussd-gw,     to_component_key: api-balance}
  - {from_component_key: ussd-gw,     to_component_key: api-bundle}
  - {from_component_key: ussd-probe,  to_component_key: ussd-gw}
