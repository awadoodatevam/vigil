# DD-F-01  Tenant settings and identity (seed parts 1 and 2, DM-R-56).
# Resolves SL-O-18 (display names). Every name is invented (SL-DR-01).
# Passwords are not part of the bundle: they come from deployment secrets (PM-M02-02).

tenant_settings:                      # DM-E-02
  customer_name: "Jazz"               # subject to CTX-O-05
  customer_logo: null                 # set only after CTX-O-05 is confirmed; customer_name is shown until then
  environment_label: "Demo environment — fictional data"   # SL-A3-06, SL-DR-03

teams:                                # DM-E-04 (complete list, 9 teams)
  - {team_key: noc-l1,             name: "NOC L1"}
  - {team_key: db-ops,             name: "Database Operations"}
  - {team_key: it-apps,            name: "IT Applications"}
  - {team_key: it-infra,           name: "IT Infrastructure"}
  - {team_key: vas-ops,            name: "VAS Operations"}
  - {team_key: vas-service-owners, name: "VAS Service Owners"}
  - {team_key: noc-shift-lead,     name: "NOC Shift Lead"}
  - {team_key: noc-management,     name: "NOC Management"}
  - {team_key: customer-care,      name: "Customer Care"}

users:                                # DM-E-03 (complete list, SL-A3-07); display names resolve SL-O-18
  - {username: presenter,      display_name: "Demo Presenter"}
  - {username: noc-l1,         display_name: "Hira Baig (NOC L1)"}
  - {username: dbops-engineer, display_name: "Usman Tariq (DB Ops)"}
  - {username: dbops-lead,     display_name: "Farah Naqvi (DB Ops Lead)"}
  - {username: admin,          display_name: "Vigil Administrator"}

memberships:                          # DM-E-05 (complete list). Teams not listed here have no members (configuration data only).
  - {team_key: noc-l1, username: noc-l1}
  - {team_key: db-ops, username: dbops-engineer}
  - {team_key: db-ops, username: dbops-lead}

permission_grants:                    # DM-E-06, DM-E06-R1 (complete list)
  presenter:      [view]
  noc-l1:         [acknowledge]
  dbops-engineer: [acknowledge, approve_action]
  dbops-lead:     [acknowledge, approve_action]
  admin:          [view, manage_setup, manage_routing, manage_ai_settings, rerun_ai_investigation, edit_workflow, run_test_replay, publish_workflow]
