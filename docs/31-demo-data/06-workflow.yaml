# DD-F-06  Workflow and workflow version 1 (seed part 16), and the draft changes of SL-A2-06.
# Resolves SL-O-22 (workflow version 1), SL-O-09 (approval expiry), SL-O-14 (escalation timer), PM-O-08 (recovery maximum wait).
# Content structure: DM-V-05. Step types and parameters: DM Section 9. Requirements met: PM-WV-01 to PM-WV-04 (DD-K-07).
# A named output with no connection ends the run when taken (DM-V-05).

workflow:
  name: "Incident handling"
  version_1:
    origin: seed
    steps:
      - {step_id: s-trigger,     type: trigger,        label: "Incident created or reopened", position: {x: 0,    y: 300}, parameters: {event: incident_created_or_reopened}}
      - step_id: s-severity
        type: condition
        label: "Severity"
        position: {x: 220, y: 300}
        parameters:
          branches:
            - {label: p1, comparisons: [{field: severity, operator: equals, value: P1}]}
      # P1 branch
      - {step_id: s-diagnose,    type: diagnostic,     label: "Check the DB server",        position: {x: 440,  y: 100}, parameters: {diagnostics: [disk_usage, largest_folders, disk_growth], target: hypothesis_component}}
      - {step_id: s-investigate, type: ai_task,        label: "AI investigation",           position: {x: 660,  y: 100}, parameters: {task: SL-T-1}}
      - {step_id: s-summarise,   type: ai_task,        label: "AI summary",                 position: {x: 880,  y: 100}, parameters: {task: SL-T-2}}
      - {step_id: s-ticket,      type: ticket,         label: "Create Jira ticket",         position: {x: 1100, y: 100}, parameters: {operation: create}}
      - {step_id: s-notify,      type: notification,   label: "Notify owner, informed and NOC L1", position: {x: 1320, y: 100}, parameters: {recipients: [owner_team, informed_parties, named_teams], named_teams: [noc-l1]}}
      - {step_id: s-wait-ack,    type: escalation,     label: "Wait for acknowledgement",   position: {x: 1540, y: 100}, parameters: {mode: wait_for_acknowledgement, timer_s: 600}}
      - {step_id: s-similar,     type: ai_task,        label: "Find similar past incident", position: {x: 1760, y: 100}, parameters: {task: SL-T-3}}
      - {step_id: s-approve,     type: approval,       label: "DB Ops approval",            position: {x: 1980, y: 100}, parameters: {eligible_teams: [db-ops], expiry_s: 900}}
      - {step_id: s-action,      type: action,         label: "Run approved fix",           position: {x: 2200, y: 100}, parameters: {}}
      - {step_id: s-recover,     type: recovery_check, label: "Verify recovery",            position: {x: 2420, y: 100}, parameters: {max_wait_s: 300}}
      - {step_id: s-resolve,     type: ticket,         label: "Resolve Jira ticket",        position: {x: 2640, y: 0},   parameters: {operation: resolve}}
      - {step_id: s-escalate,    type: escalation,     label: "Escalate with evidence",     position: {x: 2640, y: 200}, parameters: {mode: escalate_now}}
      # otherwise branch (not P1)
      - {step_id: s-summarise-2, type: ai_task,        label: "AI summary",                 position: {x: 440,  y: 500}, parameters: {task: SL-T-2}}
      - {step_id: s-ticket-2,    type: ticket,         label: "Create Jira ticket",         position: {x: 660,  y: 500}, parameters: {operation: create}}
      - {step_id: s-notify-2,    type: notification,   label: "Notify owner team",          position: {x: 880,  y: 500}, parameters: {recipients: [owner_team]}}
      - {step_id: s-recover-2,   type: recovery_check, label: "Verify recovery",            position: {x: 1100, y: 500}, parameters: {max_wait_s: 14400}}
      - {step_id: s-resolve-2,   type: ticket,         label: "Resolve Jira ticket",        position: {x: 1320, y: 500}, parameters: {operation: resolve}}
    connections:
      - {from_step_id: s-trigger,     from_output: next,          to_step_id: s-severity}
      - {from_step_id: s-severity,    from_output: p1,            to_step_id: s-diagnose}
      - {from_step_id: s-severity,    from_output: otherwise,     to_step_id: s-summarise-2}
      - {from_step_id: s-diagnose,    from_output: done,          to_step_id: s-investigate}
      - {from_step_id: s-diagnose,    from_output: failed,        to_step_id: s-investigate}
      - {from_step_id: s-investigate, from_output: done,          to_step_id: s-summarise}
      - {from_step_id: s-investigate, from_output: unavailable,   to_step_id: s-summarise}
      - {from_step_id: s-summarise,   from_output: done,          to_step_id: s-ticket}
      - {from_step_id: s-summarise,   from_output: unavailable,   to_step_id: s-ticket}
      - {from_step_id: s-ticket,      from_output: done,          to_step_id: s-notify}
      - {from_step_id: s-ticket,      from_output: failed,        to_step_id: s-notify}
      - {from_step_id: s-notify,      from_output: sent,          to_step_id: s-wait-ack}
      - {from_step_id: s-notify,      from_output: failed,        to_step_id: s-wait-ack}
      - {from_step_id: s-wait-ack,    from_output: next,          to_step_id: s-similar}
      - {from_step_id: s-similar,     from_output: done,          to_step_id: s-approve}
      - {from_step_id: s-similar,     from_output: unavailable,   to_step_id: s-approve}
      - {from_step_id: s-approve,     from_output: approved,      to_step_id: s-action}
      - {from_step_id: s-approve,     from_output: rejected,      to_step_id: s-escalate}
      - {from_step_id: s-approve,     from_output: expired,       to_step_id: s-escalate}
      - {from_step_id: s-action,      from_output: succeeded,     to_step_id: s-recover}
      - {from_step_id: s-action,      from_output: failed,        to_step_id: s-recover}
      - {from_step_id: s-recover,     from_output: recovered,     to_step_id: s-resolve}
      - {from_step_id: s-recover,     from_output: not_recovered, to_step_id: s-escalate}
      - {from_step_id: s-summarise-2, from_output: done,          to_step_id: s-ticket-2}
      - {from_step_id: s-summarise-2, from_output: unavailable,   to_step_id: s-ticket-2}
      - {from_step_id: s-ticket-2,    from_output: done,          to_step_id: s-notify-2}
      - {from_step_id: s-ticket-2,    from_output: failed,        to_step_id: s-notify-2}
      - {from_step_id: s-notify-2,    from_output: sent,          to_step_id: s-recover-2}
      - {from_step_id: s-notify-2,    from_output: failed,        to_step_id: s-recover-2}
      - {from_step_id: s-recover-2,   from_output: recovered,     to_step_id: s-resolve-2}
      - {from_step_id: s-recover-2,   from_output: not_recovered, to_step_id: s-escalate}      # PM-WV-04 holds on every branch
# Outputs that end the run (no connection): s-resolve done/failed; s-escalate next; s-resolve-2 done/failed.
# The not-P1 branch reaches s-escalate only if its 4-hour recovery wait ends; no demo scene runs that long.
# Parameter names ending in _s are the Duration parameters of DM Section 9 (expiry, timer, max_wait) in seconds.

# SL-A2-06: the draft changes the admin makes in the editor, applied in this order to a copy of version 1.
# Publishing the result creates version 2 (DD-K-07 checks it). Rolling back to version 1 then creates version 3.
draft_changes_for_version_2:
  - change: add_step
    step: {step_id: s-approve-2, type: approval, label: "DB Ops second approval", position: {x: 2090, y: 0}, parameters: {eligible_teams: [db-ops], expiry_s: 900}}
  - change: remove_connection
    connection: {from_step_id: s-approve, from_output: approved, to_step_id: s-action}
  - change: add_connection
    connection: {from_step_id: s-approve, from_output: approved, to_step_id: s-approve-2}
  - change: add_connection
    connection: {from_step_id: s-approve-2, from_output: approved, to_step_id: s-action}
  - change: add_connection
    connection: {from_step_id: s-approve-2, from_output: rejected, to_step_id: s-escalate}
  - change: add_connection
    connection: {from_step_id: s-approve-2, from_output: expired, to_step_id: s-escalate}
  - change: set_parameter
    step_id: s-wait-ack
    parameter: timer_s
    before: 600
    after: 120
# The first approval's expiry (900 s) covers both approvals, as DM-R-30 requires: the operator gives the second
# approval within 10 minutes of the first request (30-jazz-storyboard SB-D02 step 8).
