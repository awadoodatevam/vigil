# DD-F-10  Jazz lab, fault mechanics, monitoring configuration and timing targets (demo-only: PM-DC-01 to PM-DC-04;
# NOT seeded into Vigil). Resolves SL-O-02 and SL-O-16 (fault definitions in 30-jazz-storyboard Section 6).
# Every host and name is invented. Values marked "measured" are recorded here by lab spike SB-T-01 (DD-O-03).

lab_hosts:                            # one container per host on the main host (50-architecture AR-U-08, AR-X-01; GNU coreutils, findutils)
  - {host: lab-db-01,    runs: [mock subscriber database],                                                            component: srv-db-01}
  - {host: lab-api-01,   runs: [mock balance-check API (instances 1-4), mock bundle-purchase API (instances 1-4)],     component: srv-api-01}
  - {host: lab-vas-01,   runs: [mock USSD gateway (nodes ussd-gw-a, ussd-gw-b), mock SMS queue with its SMS dispatcher (24 routes)], component: srv-vas-01}
  - {host: lab-probe-01, runs: [synthetic USSD session probes (10 city labels x 5 journeys, every 10 s)],               component: srv-probe-01}
  - {host: lab-rpt-01,   runs: [mock report export job (exists only to produce SL-F-3)],                              component: srv-rpt-01}
# The real Zabbix server, Prometheus and Alertmanager monitor these hosts; they run on the main host on lab-net
# (50-architecture AR-U-09, AR-U-10, AR-X-02).

mock_behaviour:                       # what each mock does (complete list); all traffic is generated inside the lab
  subscriber_database: "Accepts reads and writes from the APIs, the USSD gateway and the SMS dispatcher, in 6 schemas (complete list, one Zabbix write-error item each, LA-02): subscriber_profile, balance_ledger, bundle_catalog, bundle_orders, ussd_sessions, sms_delivery. A write fails with 'No space left on device' while /data has less than 256 MiB free, or with 'database is read-only' while the read-only flag is set. It never writes files to /data itself, so /data use changes only through the faults and the action."
  api_instances: "Each instance runs its own steady request stream on each of its 4 endpoints (one request per second per endpoint); a request fails when any of its writes fails. Writes per request (complete list): balance-check API, every endpoint: one row to balance_ledger and one update to subscriber_profile (last activity); bundle-purchase API, every endpoint: one row to bundle_orders, and /v1/bundles/offers also one update to bundle_catalog (offer view counter). Exposes request and error counters per instance and endpoint."
  ussd_gateway: "Each node runs its own steady session stream on each of its 6 menus (one session per second per menu), calling the balance-check API (menu balance) or the bundle-purchase API (the other 5 menus), and writes one row per session to ussd_sessions; a session that gets an API error, a failed write or no answer within 2 s counts as a timeout. Exposes session and timeout counters per node and menu."
  sms_queue: "Each of the 24 routes receives one message per second. The dispatcher records each delivery as one row in sms_delivery before sending; when the write fails it stops, so every route's queue depth grows. When writes work again the queues drain at 20 messages per second per route."
  synthetic_probes: "Every 10 s, for each city label and journey, one scripted USSD session through the gateway; exposes the last result (1 = success, 0 = failure) per city and journey. City labels are synthetic probe names, not real probe sites."
  report_export_job: "Runs every 10 minutes and writes its last result (success or failure) to a status file that Zabbix reads. While SL-F-3 is active, every run fails, so its alert stays firing until 'Clear all faults' or a reset."
  every_writer_rate: "Each of the 6 schemas receives at least one write per second from the mocks above, so while writes fail every schema reports write errors (LA-02: 6 alerts)."

lab_db_server:
  # Sizes below are the demo size profile. 60-build-plan BP-R-30 (amendment BP-A-05): profile test is used in cloud sessions, CI and app tests;
  # values that depend on sizes are compared exactly only in profile demo.
  data_filesystem: {mount: /data, type: xfs, device_size_gib: 16}
  filesystem_setup: "lab-db-01 runs as a privileged container that, at every start, creates its XFS image file on a named volume when it does not exist and loop-mounts it at /data (60-build-plan BP-A-05)"
  size_profiles:
    demo: {device_size_gib: 16, /data/db: 6, /data/export: 1}
    test: {device_size_gib: 4, /data/db: 0.8, /data/export: 0.1}
  baseline_content: {/data/db: "6 GiB (database files)", /data/export: "1 GiB (export files)", /data/txlog_archive: "empty"}
  baseline_used_gib: 7
  baseline_used_pct: measured           # expected 43 to 45
  no_purge_job: "No archive shipping or purge job runs in the lab; the nightly purge exists only in the story and in RB-DB-01. Only the registered action and the clear step delete archive files."
  injected_size: "about 8.8 GiB (16 GiB device - 7 GiB baseline - XFS overhead - 64 MiB free); it MUST be larger than the largest baseline folder plus 1 GiB (so /data/txlog_archive is the largest folder) and at most the 12 GiB action limit (so the action removes every injected file). Measured by SB-T-01."
  files_never_touched: "No reset, fault or clear step creates, changes or touches any file under /data/db or /data/export, so their change times stay older than any diagnostic period."
  permissions: "Folders under /data are readable and traversable by the diagnostic user's group; the action user owns /data/txlog_archive and can delete files in it; neither user can write anywhere else under /data."
  clock: "every lab host and the Vigil server run in UTC, synchronised by NTP"
  expected_diagnostics_after_SL-F-1:   # exact values are measured by SB-T-01 and recorded here
    disk_usage: "/data is 100% full (<used> of <size> GiB used, 0.1 GiB free)"
    largest_folders_top1: "/data/txlog_archive (<size> GiB)"
    disk_growth: "<gib> GiB written to <files> files under /data in the last 15 minutes"
  expected_action_result: "every injected file removed (<files> files, <gib> GiB, both measured, under the 12 GiB limit); /data returns to its baseline percentage"
  development_values:                  # SB-T-01 development run (60-build-plan P-04, BP-A-18): owner's Mac, profile demo; final values P-32
    measured_on: 2026-10-16              # UTC date of the run, YYYY-MM-DD
    baseline_used_pct: 47        # fs_used_pct before injection
    injected_files: 34           # N + 1
    injected_bytes: 9167810560
    injected_gib: 8.5             # bytes / 1073741824, rounded half-up to 1 decimal place (DD-F-04)
    disk_usage: "/data is 100% full (15.9 of 15.9 GiB used, 0.1 GiB free)"               # disk_usage summary after SL-F-1 (the whole DD-F-04 summary_template, filled)
    largest_folders: "Largest folder under /data: /data/txlog_archive (8.5 GiB)"          # largest_folders summary after SL-F-1 (the whole summary)
    disk_growth: "8.5 GiB written to 34 files under /data in the last 15 minutes"              # disk_growth summary after SL-F-1
    action_files_removed: 34
    action_gib_removed: 8.5
    used_pct_after_action: 47    # fs_used_pct after the action

faults:
  SL-F-1:
    name: "Subscriber DB /data full"
    story: "Archive shipping caught up after a link outage and wrote two days of transaction log archives back to /data."
    inject: "(1) Read /data free space F. (2) Compute N = the number of 256 MiB files that fit while at least 320 MiB stay free, plus one last file of size (F - N x 256 MiB - 64 MiB) rounded down to a multiple of 4 KiB, so 64 MiB stay free (below the 256 MiB write limit and the 1 GiB disk trigger; df shows 100% in the demo profile and 99% in the test profile, 60-build-plan BP-R-30). (3) Create the N + 1 files in /data/txlog_archive with fallocate, named txlog_000001.arc to txlog_<N+1>.arc (numbering restarts at 1 for every injection). (4) Set the modification times of all N + 1 files, the last one included, evenly from 47 hours to 26 hours before now. Every injected file is therefore older than the 24-hour purge limit and has a change time of now."
    clear: "delete the injected files that still exist"
    expected_effect: "the 126 storm alerts of DD-F-03 fire within 120 s"
  SL-F-2:
    name: "Subscriber DB stays read-only"
    story: "This time the database also switched itself to read-only mode."
    inject: "set the mock database's read-only flag; it stays set after disk space is freed"
    clear: "unset the read-only flag"
    expected_effect: "injected together with SL-F-1: after the action, /data returns to baseline but every storm alert except the 2 disk_full alerts keeps firing (124 alerts)"
  SL-F-3:
    name: "Unrelated report export failure"
    inject: "set the report export job to fail on every run and start a run at once; injected by the same control-panel action as SL-F-1"
    clear: "set the job back to succeed and start a successful run at once"
    expected_effect: "one Zabbix alert 'Report export job failed' (LA-09) within 30 s"
  SL-F-4:
    name: "Cloud AI unreachable"
    inject: "in the main host's DOCKER-USER iptables chain, for source addresses 172.30.0.10 and 172.31.0.10 (vigil-app, 50-architecture AR-X-03): (1) resolve api.anthropic.com and api.openai.com and add a rule that rejects, with a TCP reset, every connection to those addresses on port 443; (2) close established connections to them; (3) every 30 s while SL-F-4 is active, resolve both names again and add any new address to the rule. No host-name mapping is changed, so no request reaches another local service."
    clear: "remove the rule; established connections are not affected"
    executed_by: "the demo-faults component on the Vigil host (demo-only). It acts on the host's network, never calls Vigil, and is reached only from the control panel (SL-B-10)."
    scope: "only the two cloud AI API host names; Jira, Teams, email, webhooks, the local model and the local embedding model stay reachable (PM-ASM-04)"
    expected_effect: "every call to Claude or OpenAI fails as unreachable within 5 s, so the AI gateway falls back to the next provider (SB-ASM-03)"

monitoring_configuration:             # PM-DC-02 (complete list of settings that matter to the demo; DD-ASM-03, DD-ASM-05)
  prometheus: "scrape_interval 5 s and evaluation_interval 5 s for every lab job; one alerting rule per Alertmanager catalogue row (LA-04..LA-08): error or timeout rate over a 20 s window above 0.2 per second, filesystem available bytes on /data below 1 GiB, or last probe result 0; 'for: 10s'; no keep_firing_for; every rule carries the label component (DD-F-02) and the annotation summary (complete list, 40-demo-cut DC-A-17; placeholders are the alert's label values): LA-04 'Disk full on lab-db-01 /data'; LA-05 'Balance-check API errors on {instance} {endpoint}'; LA-06 'Bundle-purchase API errors on {instance} {endpoint}'; LA-07 'USSD gateway timeouts on {node}, menu {menu}'; LA-08 'Synthetic USSD session failed: {city}, {journey}'"
  alertmanager: "one route that matches exactly the 5 catalogue alertnames and sends to the Vigil webhook receiver with group_by ['...'] (every alert its own group), group_wait 5s, group_interval 10s, repeat_interval 12h, send_resolved true, max_alerts 0, http_config.authorization type Bearer with the webhook token in credentials_file; every other alert goes to a receiver with no integration; its web interface requires basic authentication for user vigil (--web.config.file), which Prometheus also uses to send alerts (50-architecture AR-X-02, Section 12.4)"
  zabbix_items: "update interval 10 s for every lab item: /data free bytes; database write error count per schema; SMS queue depth per route; last report export result"
  zabbix_triggers: "LA-01: /data free space below 1 GiB (last value). LA-02: write errors in the last 20 s above 0. LA-03: queue depth higher than 20 s ago and above 20 messages. LA-09: last report export result is failure. Each trigger carries the tags component (DD-F-02) and vigil=lab."
  zabbix_action: "one trigger action limited to problems tagged vigil=lab; operation: send to the Vigil webhook media type at step 1 only (steps 1-1, so no repeat); recovery operation: send the recovery to the same media type; no update operations"
  webhook_base_url: "lab value from deploy/values/{installation}.yaml, not part of the seed bundle; demo installation https://demo.${demo_domain}; local installation http://demo.vigil.test:8080 (60-build-plan BP-A-04)"
  zabbix_media_type: "a webhook media type whose script posts one JSON message per problem or recovery to ${webhook_base_url}/api/v1/webhooks/zabbix-lab with the source's token as a Bearer Authorization header and header User-Agent zabbix-webhook; the message is exactly the JSON object of 50-architecture Section 12.3. Parameters (complete list): event_id {EVENT.ID} (the alert key, the same for the problem and its recovery); event_value {EVENT.VALUE} (1 problem, 0 recovery); event_name {EVENT.NAME}; host {HOST.HOST}; tags {EVENT.TAGSJSON}; event_date {EVENT.DATE}; event_time {EVENT.TIME}; recovery_date {EVENT.RECOVERY.DATE}; recovery_time {EVENT.RECOVERY.TIME}; severity {EVENT.SEVERITY}"

timing_targets:                       # verified by SB-T-01 and SB-T-05
  storm_arrival: "every one of the 126 storm alerts reaches Vigil as exactly one firing entry within 120 s of injection; no gap longer than 25 s between consecutive storm alert arrivals; no repeated firing entry for any storm alert during the storm"
  resolve_after_action: "every storm alert's resolved entry reaches Vigil within 60 s after the action ends"
  no_refire: "no storm alert fires again within 300 s after it resolved"
  resolve_after_clear: "after 'Clear all faults', every lab alert's resolved entry reaches Vigil within 40 s"
  numbers: {arrival_within_s: 120, max_gap_s: 25, resolve_after_action_s: 60, no_refire_s: 300, resolve_after_clear_s: 40, clear_settle_s: 12}

control_panel:                        # PM-DC-03, PM-DC-04 (screen content in Round 4)
  buttons: ["Storm: SL-F-1 + SL-F-3", "Storm re-run: SL-F-1", "Storm with read-only DB: SL-F-1 + SL-F-2", "Cut cloud AI: SL-F-4", "Clear all faults", "Reset"]
  fault_state: "the control panel keeps its own record of active faults: a fault is active from the button that triggers it until 'Clear all faults' or a reset completes, even when the action has already removed SL-F-1's files"
  clear_all_faults: "clears every active fault, then is complete 12 s after Zabbix (problem list, read-only API) and Alertmanager (alerts API, read-only) both show no firing catalogue alert (the 12 s are longer than Alertmanager's 10 s group_interval, so every resolved entry has reached Vigil)"
  reset: "the protocol of 50-architecture AR-B-03: branch A clears every active fault and waits until no catalogue alert fires plus 12 s; branch B, in parallel, creates a new tenant and imports the seed bundle through Vigil's installation operations; when both have succeeded the demo host's alias is set to the new tenant; the reset is complete when the alias is set, within 60 s in total (SB-T-05)"
  storm_guard: "every storm button is refused while SL-F-1, SL-F-2 or SL-F-3 is active or 'Clear all faults' or a reset is running; an active SL-F-4 does not block storm buttons (SB-T-09 uses a storm during SL-F-4)"
  vigil_state: "the control panel never reads Vigil's incidents; the spacing rules that depend on Vigil (SB-R-03, SB-R-04) are the operator's responsibility"
