# DD-F-03  Monitoring sources, alert types, alert type mappings (seed part 6), and the lab alert catalogue (demo-only).
# Resolves SL-O-12 (health thresholds) and DM-O-03 (health check interval).
# Field names used in mappings ("event_name", "label.alertname") are working names; Round 5 fixes the connectors'
# normalisable field names (DM-O-04) and MUST keep the meaning given here (DD-ASM-01).

monitoring_sources:                   # DM-E-15 (complete list, 2)
  - {name: "Zabbix — Jazz lab",       source_kind: zabbix,       connector_instance: zabbix-lab,       webhook_token_ref: cred-webhook-zabbix,       health_check_interval_s: 30, stale_after_s: 120, disconnected_after_s: 300}
  - {name: "Alertmanager — Jazz lab", source_kind: alertmanager, connector_instance: alertmanager-lab, webhook_token_ref: cred-webhook-alertmanager, health_check_interval_s: 30, stale_after_s: 120, disconnected_after_s: 300}

alert_types:                          # DM-E-16 (complete list, 18; "unclassified" is reserved and always exists)
  # the seven storm types of SL-A1-01
  - {alert_type: disk_full,             display_name: "Disk full"}
  - {alert_type: db_write_errors,       display_name: "Database write errors"}
  - {alert_type: ussd_timeouts,         display_name: "USSD gateway timeouts"}
  - {alert_type: balance_api_errors,    display_name: "Balance-check API errors"}
  - {alert_type: bundle_api_errors,     display_name: "Bundle-purchase API errors"}
  - {alert_type: sms_queue_growth,      display_name: "SMS queue growth"}
  - {alert_type: ussd_synthetic_failed, display_name: "Synthetic USSD session failed"}
  # the SL-F-3 type
  - {alert_type: report_job_failed,     display_name: "Report export job failed"}
  # types used only by past incidents (DD-F-09); the lab never sends them, so they have no mapping
  - {alert_type: disk_space_low,           display_name: "Disk space low"}
  - {alert_type: api_latency_high,         display_name: "API latency high"}
  - {alert_type: db_lock_waits,            display_name: "Database lock waits"}
  - {alert_type: db_connections_exhausted, display_name: "Database connections exhausted"}
  - {alert_type: db_replication_lag,       display_name: "Database replication lag"}
  - {alert_type: ussd_node_down,           display_name: "USSD gateway node down"}
  - {alert_type: smsc_bind_down,           display_name: "SMSC bind down"}
  - {alert_type: cpu_saturation,           display_name: "CPU saturation"}
  - {alert_type: memory_pressure,          display_name: "Memory pressure"}
  - {alert_type: cert_expiring,            display_name: "Certificate expiring"}

alert_type_mappings:                  # DM-E-17 (complete list, 9). First true mapping in order wins (DM-E17-R1).
  - {source_kind: zabbix,       order: 1, field: event_name,      operator: starts_with, value: "Disk full",             alert_type: disk_full}
  - {source_kind: zabbix,       order: 2, field: event_name,      operator: starts_with, value: "Database write errors", alert_type: db_write_errors}
  - {source_kind: zabbix,       order: 3, field: event_name,      operator: starts_with, value: "SMS queue growing",     alert_type: sms_queue_growth}
  - {source_kind: zabbix,       order: 4, field: event_name,      operator: equals,      value: "Report export job failed", alert_type: report_job_failed}
  - {source_kind: alertmanager, order: 1, field: label.alertname, operator: equals,      value: NodeFilesystemFull,         alert_type: disk_full}
  - {source_kind: alertmanager, order: 2, field: label.alertname, operator: equals,      value: BalanceApiErrors,           alert_type: balance_api_errors}
  - {source_kind: alertmanager, order: 3, field: label.alertname, operator: equals,      value: BundleApiErrors,            alert_type: bundle_api_errors}
  - {source_kind: alertmanager, order: 4, field: label.alertname, operator: equals,      value: UssdGatewayTimeouts,        alert_type: ussd_timeouts}
  - {source_kind: alertmanager, order: 5, field: label.alertname, operator: equals,      value: SyntheticUssdSessionFailed, alert_type: ussd_synthetic_failed}

# ---------------------------------------------------------------------------------------------------------------
# Lab alert catalogue (demo-only, PM-DC-02; NOT seeded into Vigil). One row per alert rule or trigger prototype.
# Each combination of the listed dimension values is one distinct alert (one alert key), so a storm sends exactly
# the number of firing alert entries given in "count" (DM-R-02). Zabbix alerts carry the event tag "component";
# Alertmanager alerts carry the label "component" (identity keys, DD-F-02).
lab_alert_catalogue:
  - id: LA-01
    source: zabbix
    host: lab-db-01
    tag_component: srv-db-01
    trigger_name: "Disk full: /data free space below 1 GiB"
    fires_in: [SL-F-1]
    count: 1
  - id: LA-02
    source: zabbix
    host: lab-db-01
    tag_component: db-subscriber
    trigger_name: "Database write errors on schema {schema}"
    dimensions: {schema: [subscriber_profile, balance_ledger, bundle_catalog, bundle_orders, ussd_sessions, sms_delivery]}
    fires_in: [SL-F-1, SL-F-2]
    count: 6
  - id: LA-03
    source: zabbix
    host: lab-vas-01
    tag_component: sms-queue
    trigger_name: "SMS queue growing on route {route}"
    dimensions: {route: [route-01, route-02, route-03, route-04, route-05, route-06, route-07, route-08, route-09, route-10, route-11, route-12, route-13, route-14, route-15, route-16, route-17, route-18, route-19, route-20, route-21, route-22, route-23, route-24]}
    fires_in: [SL-F-1, SL-F-2]
    count: 24
  - id: LA-04
    source: alertmanager
    alertname: NodeFilesystemFull
    labels: {component: srv-db-01, instance: "lab-db-01:9100", mountpoint: /data}
    fires_in: [SL-F-1]
    count: 1
  - id: LA-05
    source: alertmanager
    alertname: BalanceApiErrors
    labels: {component: api-balance}
    dimensions: {instance: [api-balance-1, api-balance-2, api-balance-3, api-balance-4], endpoint: [/v1/balance, /v1/balance/main, /v1/balance/bundles, /v1/balance/history]}
    fires_in: [SL-F-1, SL-F-2]
    count: 16
  - id: LA-06
    source: alertmanager
    alertname: BundleApiErrors
    labels: {component: api-bundle}
    dimensions: {instance: [api-bundle-1, api-bundle-2, api-bundle-3, api-bundle-4], endpoint: [/v1/bundles/offers, /v1/bundles/purchase, /v1/bundles/active, /v1/bundles/renew]}
    fires_in: [SL-F-1, SL-F-2]
    count: 16
  - id: LA-07
    source: alertmanager
    alertname: UssdGatewayTimeouts
    labels: {component: ussd-gw}
    dimensions: {node: [ussd-gw-a, ussd-gw-b], menu: [balance, data-bundles, voice-bundles, sms-bundles, my-bundles, bundle-status]}
    fires_in: [SL-F-1, SL-F-2]
    count: 12
  - id: LA-08
    source: alertmanager
    alertname: SyntheticUssdSessionFailed
    labels: {component: ussd-probe}
    dimensions: {city: [karachi, lahore, islamabad, rawalpindi, faisalabad, multan, peshawar, quetta, hyderabad, sialkot], journey: [balance-check, bundle-list, bundle-purchase, bundle-status, sms-confirmation]}
    fires_in: [SL-F-1, SL-F-2]
    count: 50
  - id: LA-09
    source: zabbix
    host: lab-rpt-01
    tag_component: report-export
    trigger_name: "Report export job failed"
    fires_in: [SL-F-3]
    count: 1
# Storm (SL-F-1): 126 alerts = 31 from Zabbix (LA-01..LA-03) + 95 from Alertmanager (LA-04..LA-08). SL-F-3 adds 1 (LA-09).
# With SL-F-2 active, after the action every storm alert except the 2 disk_full alerts (LA-01, LA-04) keeps firing: 124.
