# DD-F-07  Connectors and credentials (seed part 3), AI gateway settings (part 7), knowledge settings (part 8),
# incident settings (part 9), correlation settings (part 10), delivery addresses (part 15), baselines (part 17).
# Resolves SL-O-04, DM-O-01, DM-O-02, DM-O-09, DM-O-10, PM-O-16, and the dashboard baselines.
# "<demo-domain>" is the demo domain (CTX-O-02). "R5" marks a value fixed in Round 5 (DD-O-02).

credential_references:                # DM-E-11 (complete list, 10); locators only, never secret values (SL-B-14)
  - {handle: cred-webhook-zabbix,       purpose: webhook_token,     locator: R5}
  - {handle: cred-webhook-alertmanager, purpose: webhook_token,     locator: R5}
  - {handle: cred-zabbix-api,           purpose: external_api,      locator: R5}
  - {handle: cred-alertmanager-api,     purpose: external_api,      locator: R5}
  - {handle: cred-lab-db-01-diag,       purpose: target_diagnostic, locator: R5}
  - {handle: cred-lab-db-01-action,     purpose: target_action,     locator: R5}
  - {handle: cred-jira,                 purpose: external_api,      locator: R5}
  - {handle: cred-smtp,                 purpose: smtp,              locator: R5}
  - {handle: cred-claude,               purpose: external_api,      locator: R5}
  - {handle: cred-openai,               purpose: external_api,      locator: R5}

connector_instances:                  # DM-E-10 (complete list, 11)
  - {handle: zabbix-lab,       name: "Zabbix — Jazz lab",            kind: zabbix,          address: "https://zabbix.<demo-domain>",       settings: R5, credential_ref: cred-zabbix-api}
  - {handle: alertmanager-lab, name: "Alertmanager — Jazz lab",      kind: alertmanager,    address: "https://alertmanager.<demo-domain>", settings: R5, credential_ref: cred-alertmanager-api}
  - {handle: linux-lab-db-01,  name: "Subscriber DB server (lab)",   kind: linux_server,    address: "lab-db-01.<demo-domain>",            settings: R5, credential_ref: null}   # credentials per grant (DD-F-04)
  - {handle: jira-demo,        name: "Jira Cloud — demo project",    kind: jira_cloud,      address: R5, settings: R5, credential_ref: cred-jira}
  - {handle: teams-demo,       name: "Microsoft Teams — Vigil Demo", kind: ms_teams,        address: R5, settings: R5, credential_ref: null}   # secret per channel: see DD-O-04
  - {handle: email-demo,       name: "Email — demo domain",          kind: email,           address: R5, settings: R5, credential_ref: cred-smtp}
  - {handle: claude-api,       name: "Claude API",                   kind: claude,          address: R5, settings: R5, credential_ref: cred-claude}
  - {handle: openai-api,       name: "OpenAI API",                   kind: openai,          address: R5, settings: R5, credential_ref: cred-openai}
  - {handle: local-llm,        name: "Local model",                  kind: local_model,     address: R5, settings: R5, credential_ref: null}
  - {handle: local-embed,      name: "Local embedding model",        kind: local_embedding, address: R5, settings: R5, credential_ref: null}
  - {handle: openai-embed-api, name: "OpenAI API — embeddings",      kind: openai,          address: R5, settings: R5, credential_ref: cred-openai}

ai_provider_configurations:           # DM-E-70 (complete list, 5); model names and prices DM-O-13 (Round 5)
  - {provider_key: claude,       provider_kind: claude,          connector_instance: claude-api,       location: external, model_name: R5, price_input_per_million: R5, price_output_per_million: R5}
  - {provider_key: openai,       provider_kind: openai,          connector_instance: openai-api,       location: external, model_name: R5, price_input_per_million: R5, price_output_per_million: R5}
  - {provider_key: openai-embed, provider_kind: openai,          connector_instance: openai-embed-api, location: external, model_name: R5, price_input_per_million: R5, price_output_per_million: 0}
  - {provider_key: local-llm,    provider_kind: local_model,     connector_instance: local-llm,        location: in_house, model_name: R5, price_input_per_million: 0,  price_output_per_million: 0}
  - {provider_key: local-embed,  provider_kind: local_embedding, connector_instance: local-embed,      location: in_house, model_name: R5, price_input_per_million: 0,  price_output_per_million: 0}

allowed_providers:                    # DM-E-71, exactly DM-E71-R1
  SL-T-1: [claude, openai, local_model]
  SL-T-2: [claude, openai, local_model]
  SL-T-3: [local_embedding, openai]

task_assignments:                     # DM-E-72; default AI settings. SL-T-1/SL-T-2 order is the Round 3 proposal for SL-O-20 (SB-O-01).
  SL-T-1: [claude, openai, local-llm]
  SL-T-2: [claude, openai, local-llm]
  SL-T-3: [local-embed]               # exactly one provider (DM-E72-R2); CTX-D-011

data_routing_rules:                   # DM-E-73; resolves DM-O-10. Default: every category may go to every provider,
                                      # because the demo data is fictional. SB-D05 shows an admin narrowing one category.
  alert_data:        [claude, local-embed, local-llm, openai, openai-embed]
  service_context:   [claude, local-embed, local-llm, openai, openai-embed]
  diagnostic_output: [claude, local-embed, local-llm, openai, openai-embed]
  runbook_text:      [claude, local-embed, local-llm, openai, openai-embed]
  incident_history:  [claude, local-embed, local-llm, openai, openai-embed]
  incident_record:   [claude, local-embed, local-llm, openai, openai-embed]

knowledge_settings:                   # DM-E-67
  min_similarity: 0.90                # PM-O-16
  runbook_limit: 3                    # DM-O-09
  embedding_provider_key: local-embed
  embedding_state: ready

incident_settings:                    # DM-E-40; resolves DM-O-02
  reopen_window_s: 300
  closure_check_interval_s: 30

correlation_settings:                 # DM-E-31; resolves SL-O-04 and DM-O-01
  grouping_window_s: 300              # SL-O-04
  settle_period_s: 40                 # longer than the maximum gap between storm alerts (25 s, DD-F-10) plus margin
  max_forming_s: 300                  # longer than the storm (120 s) plus the settle period
  stability_check_interval_s: 5

delivery_addresses:                   # DM-E-77 (complete list). Teams: one channel per team in the demo Team "Vigil Demo";
                                      # the address form is decided in Round 5 (PM-O-10, DD-O-04).
  - {subject_kind: team, subject_key: noc-l1,             channel: teams, address: "Vigil Demo / NOC L1"}
  - {subject_kind: team, subject_key: noc-l1,             channel: email, address: "noc-l1@<demo-domain>"}
  - {subject_kind: team, subject_key: db-ops,             channel: teams, address: "Vigil Demo / Database Operations"}
  - {subject_kind: team, subject_key: db-ops,             channel: email, address: "db-ops@<demo-domain>"}
  - {subject_kind: team, subject_key: vas-service-owners, channel: teams, address: "Vigil Demo / VAS Service Owners"}
  - {subject_kind: team, subject_key: vas-service-owners, channel: email, address: "vas-service-owners@<demo-domain>"}
  - {subject_kind: team, subject_key: it-apps,            channel: teams, address: "Vigil Demo / IT Applications"}
  - {subject_kind: team, subject_key: it-apps,            channel: email, address: "it-apps@<demo-domain>"}
  - {subject_kind: team, subject_key: noc-shift-lead,     channel: teams, address: "Vigil Demo / NOC Shift Lead"}
  - {subject_kind: team, subject_key: noc-shift-lead,     channel: email, address: "noc-shift-lead@<demo-domain>"}
  - {subject_kind: team, subject_key: noc-management,     channel: teams, address: "Vigil Demo / NOC Management"}
  - {subject_kind: team, subject_key: noc-management,     channel: email, address: "noc-management@<demo-domain>"}
  - {subject_kind: team, subject_key: customer-care,      channel: teams, address: "Vigil Demo / Customer Care"}
  - {subject_kind: team, subject_key: customer-care,      channel: email, address: "customer-care@<demo-domain>"}
  - {subject_kind: user, subject_key: dbops-engineer,     channel: teams, address: "Vigil Demo / Approvals — Usman"}
  - {subject_kind: user, subject_key: dbops-engineer,     channel: email, address: "dbops-engineer@<demo-domain>"}
  - {subject_kind: user, subject_key: dbops-lead,         channel: teams, address: "Vigil Demo / Approvals — Farah"}
  - {subject_kind: user, subject_key: dbops-lead,         channel: email, address: "dbops-lead@<demo-domain>"}
# Teams it-infra and vas-ops have no address: no workflow path or escalation level notifies them in the demo.

baseline_values:                      # DM-E-80 (complete list). Invented values, labelled "Illustrative baseline" (SL-A1-09).
                                      # Story: without correlation, every alert is handled as its own ticket.
  - {metric_key: time_to_acknowledge, value: 11.0, unit: minutes, label: "Illustrative baseline"}
  - {metric_key: time_to_recover,     value: 72.0, unit: minutes, label: "Illustrative baseline"}
  - {metric_key: alerts_suppressed,   value: 0,    unit: count,   label: "Illustrative baseline"}
  - {metric_key: incidents_merged,    value: 0,    unit: count,   label: "Illustrative baseline"}
