name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            if [ -n "$changed" ] && ! echo "$changed" | grep -qv '^docs/'; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: python tools
        run: |
          python -m venv "$RUNNER_TEMP/vigil-tools"
          "$RUNNER_TEMP/vigil-tools/bin/python" -m pip install --disable-pip-version-check -r tools/requirements-dev.txt
          echo "VIGIL_TOOLS=$RUNNER_TEMP/vigil-tools" >> "$GITHUB_ENV"

      - name: documents only
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          "$VIGIL_TOOLS/bin/python" docs/31-demo-data/tools/check_data.py docs/31-demo-data
          "$VIGIL_TOOLS/bin/python" tools/trace.py --check

      - name: java
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
          cache: maven

      - name: node
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: shellcheck
        if: steps.scope.outputs.docs_only != 'true'
        run: sudo apt-get install -y shellcheck

      - name: gate command
        if: steps.scope.outputs.docs_only != 'true'
        run: tools/check-all.sh

      - name: gitleaks
        if: steps.scope.outputs.docs_only != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks_version="8.30.1" # the same version as tools/cloud-setup.sh
          gitleaks_file="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          gitleaks_base="https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}"
          curl -fsSL -o "$RUNNER_TEMP/$gitleaks_file" "$gitleaks_base/$gitleaks_file"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks-checksums.txt" "$gitleaks_base/gitleaks_${gitleaks_version}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep -E " ${gitleaks_file}\$" gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$gitleaks_file" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks git --redact --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            gitleaks git --redact
          fi

      - name: test reports
        if: failure() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 3
