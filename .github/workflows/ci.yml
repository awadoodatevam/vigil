name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

# BP-W-01 (CTX-D-067): the job scope chooses the light gate (data only) or the full gate (the jobs java and rest in
# parallel); the job secrets runs in both; the summary job gate is the merge gate.
jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/gate_scope.py ci

  light:
    name: light
    needs: scope
    if: needs.scope.outputs.mode == 'light'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: python tools
        run: |
          python -m venv "$RUNNER_TEMP/vigil-tools"
          "$RUNNER_TEMP/vigil-tools/bin/python" -m pip install --disable-pip-version-check -r tools/requirements-dev.txt
          echo "VIGIL_TOOLS=$RUNNER_TEMP/vigil-tools" >> "$GITHUB_ENV"

      - name: data checks
        run: '"$VIGIL_TOOLS/bin/python" docs/31-demo-data/tools/check_data.py docs/31-demo-data'

      - name: traceability
        run: '"$VIGIL_TOOLS/bin/python" tools/trace.py --check'

  java:
    name: java
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VIGIL_UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu/
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
          cache: maven

      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: dns
        run: getent hosts archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com || true

      - name: gate command, part java
        run: tools/check-all.sh --part java

      - name: test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 3

  rest:
    name: rest
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VIGIL_UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu/
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: python tools
        run: |
          python -m venv "$RUNNER_TEMP/vigil-tools"
          "$RUNNER_TEMP/vigil-tools/bin/python" -m pip install --disable-pip-version-check -r tools/requirements-dev.txt
          echo "VIGIL_TOOLS=$RUNNER_TEMP/vigil-tools" >> "$GITHUB_ENV"

      - name: shellcheck
        run: sudo apt-get install -y shellcheck

      - name: dns
        run: getent hosts archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com || true

      - name: gate command, part rest
        run: tools/check-all.sh --part rest

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks_version="8.30.1" # the same version as tools/cloud-setup.sh
          gitleaks_file="gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          gitleaks_base="https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}"
          curl -fsSL -o "$RUNNER_TEMP/$gitleaks_file" "$gitleaks_base/$gitleaks_file"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks-checksums.txt" "$gitleaks_base/gitleaks_${gitleaks_version}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep -E " ${gitleaks_file}\$" gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$gitleaks_file" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks git --redact --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            gitleaks git --redact
          fi

  gate:
    name: gate
    needs: [scope, light, java, rest, secrets]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: summary
        shell: bash
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          LIGHT_RESULT: ${{ needs.light.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          REST_RESULT: ${{ needs.rest.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          passed=false
          if [ "$SCOPE_RESULT" = "success" ] && [ "$SECRETS_RESULT" = "success" ]; then
            if [ "$MODE" = "light" ] && [ "$LIGHT_RESULT" = "success" ]; then
              passed=true
            elif [ "$MODE" = "full" ] && [ "$JAVA_RESULT" = "success" ] && [ "$REST_RESULT" = "success" ]; then
              passed=true
            fi
          fi
          if [ "$passed" != "true" ]; then
            echo "mode: ${MODE:-none}"
            echo "scope: $SCOPE_RESULT"
            echo "light: $LIGHT_RESULT"
            echo "java: $JAVA_RESULT"
            echo "rest: $REST_RESULT"
            echo "secrets: $SECRETS_RESULT"
            exit 1
          fi
