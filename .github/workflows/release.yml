# BP-W-03: builds the JARs and the images of a release for linux/amd64 and pushes them to the demo installation's ECR
# repositories with the GitHub OIDC push role (deploy/build.sh; P-05 spec Section 6.14, P-32 spec Section 6.2 item 2).
# Manual run on main only.
name: release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release name (deploy/build.sh {release})"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      VIGIL_UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu/
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
          cache: maven

      - name: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.VIGIL_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: build and push
        env:
          RELEASE: ${{ inputs.release }}
        run: deploy/build.sh "$RELEASE"
