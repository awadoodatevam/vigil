# The local installation (docs/60-build-plan.md Section 11), started by deploy/local.sh: the lab hosts (P-03), Zabbix,
# Prometheus, Alertmanager, demo-faults, the webhook recorder and the storm timing spike (P-04); vigil-db, vigil-migrate,
# vigil-app, the dev fakes, Mailpit, vigil-embed (profile embed) and the Playwright runner (profile e2e) (P-26).
# Subnets and container names are fixed, so one local installation runs per Docker host.

networks:
  vigil-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1

volumes:
  lab-db-01-data:
  lab-zabbix-db-data:
  demo-faults-state:
  vigil-db-data:
  vigil-embed-models:

services:
  lab-db-01:
    image: vigil/demo-lab:local
    container_name: lab-db-01
    hostname: lab-db-01
    environment:
      LAB_ROLE: lab-db-01
      LAB_PROFILE: ${VIGIL_LAB_PROFILE:-test}
    privileged: true
    networks: [lab-net]
    volumes:
      - lab-db-01-data:/var/lib/lab-data
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/lab-db-01
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    healthcheck: &lab-health
      test: ["CMD", "test", "-f", "/run/lab/ready"]
      interval: 2s
      timeout: 2s
      retries: 60

  lab-api-01:
    image: vigil/demo-lab:local
    container_name: lab-api-01
    hostname: lab-api-01
    environment:
      LAB_ROLE: lab-api-01
    networks: [lab-net]
    depends_on:
      lab-db-01: {condition: service_healthy}
    restart: "no"
    healthcheck: *lab-health

  lab-vas-01:
    image: vigil/demo-lab:local
    container_name: lab-vas-01
    hostname: lab-vas-01
    environment:
      LAB_ROLE: lab-vas-01
    networks: [lab-net]
    depends_on:
      lab-db-01: {condition: service_healthy}
      lab-api-01: {condition: service_healthy}
    restart: "no"
    healthcheck: *lab-health

  lab-probe-01:
    image: vigil/demo-lab:local
    container_name: lab-probe-01
    hostname: lab-probe-01
    environment:
      LAB_ROLE: lab-probe-01
    networks: [lab-net]
    depends_on:
      lab-vas-01: {condition: service_healthy}
    restart: "no"
    healthcheck: *lab-health

  lab-rpt-01:
    image: vigil/demo-lab:local
    container_name: lab-rpt-01
    hostname: lab-rpt-01
    environment:
      LAB_ROLE: lab-rpt-01
    networks: [lab-net]
    restart: "no"
    healthcheck: *lab-health

  lab-zabbix-db:
    image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    container_name: lab-zabbix-db
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD_FILE: /run/secrets/vigil/zabbix-db-password
    networks: [lab-net]
    volumes:
      - lab-zabbix-db-data:/var/lib/postgresql/data
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/lab-zabbix-db
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zabbix", "-d", "zabbix"]
      interval: 2s
      timeout: 2s
      retries: 60

  lab-zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0.31@sha256:bdfe90847bd259a6da448db1e6ae83f5f439224654ed767296a8d57a088975b9
    container_name: lab-zabbix-server
    environment:
      DB_SERVER_HOST: lab-zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD_FILE: /run/secrets/vigil/zabbix-db-password
    depends_on:
      lab-zabbix-db: {condition: service_healthy}
    networks: [lab-net]
    volumes:
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/lab-zabbix-server
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  lab-zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.31@sha256:d9ce0774cb6036ce5d49c9c8d46bf1474dad98aae810350de0d5068dd679b92d
    container_name: lab-zabbix-web
    environment:
      ZBX_SERVER_HOST: lab-zabbix-server
      DB_SERVER_HOST: lab-zabbix-db
      POSTGRES_USER: zabbix
      POSTGRES_DB: zabbix
      POSTGRES_PASSWORD_FILE: /run/secrets/vigil/zabbix-db-password
      PHP_TZ: UTC
    depends_on:
      lab-zabbix-db: {condition: service_healthy}
    networks: [lab-net]
    volumes:
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/lab-zabbix-web
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  lab-zabbix-provision:
    image: vigil/lab-zabbix-provision:local
    container_name: lab-zabbix-provision
    user: "${VIGIL_LOCAL_UID:-10001}:${VIGIL_LOCAL_GID:-10001}"
    environment:
      WEBHOOK_BASE_URL: ${VIGIL_WEBHOOK_BASE_URL:-http://demo.vigil.test:8080}
      ZABBIX_URL: http://lab-zabbix-web:8080
    depends_on:
      lab-zabbix-web: {condition: service_started}
      lab-zabbix-server: {condition: service_started}
    networks: [lab-net]
    volumes:
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/lab-zabbix-provision
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VIGIL_LOCAL_GENERATED:-/nonexistent}
        target: /srv/vigil/generated
        bind:
          create_host_path: false
    restart: "no"

  lab-prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: lab-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    depends_on: &lab-hosts-healthy
      lab-db-01: {condition: service_healthy}
      lab-api-01: {condition: service_healthy}
      lab-vas-01: {condition: service_healthy}
      lab-probe-01: {condition: service_healthy}
      lab-rpt-01: {condition: service_healthy}
    networks: [lab-net]
    volumes:
      - type: bind
        source: ../../demo/monitoring/prometheus
        target: /etc/prometheus
        read_only: true
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/lab-prometheus
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  lab-alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: lab-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.config.file=/run/secrets/vigil/alertmanager-web-config
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    networks: [lab-net]
    volumes:
      - type: bind
        source: ${VIGIL_LOCAL_CONFIG:-/nonexistent}/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/lab-alertmanager
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  demo-faults:
    image: vigil/demo-faults:local
    container_name: demo-faults
    network_mode: host
    user: "0"
    environment:
      FAULTS_LISTEN: 172.31.0.1:8091
    depends_on: *lab-hosts-healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - demo-faults-state:/var/lib/demo-faults
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/demo-faults
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-c", "import socket; socket.create_connection(('172.31.0.1', 8091), 2)"]
      interval: 2s
      timeout: 2s
      retries: 30

  dev-recorder:
    image: vigil/recorder:local
    container_name: dev-recorder
    profiles: ["lab-only"]
    user: "${VIGIL_LOCAL_UID:-10001}:${VIGIL_LOCAL_GID:-10001}"
    networks:
      lab-net:
        aliases: [demo.vigil.test]
    volumes:
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/vigil-app
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VIGIL_LOCAL_RECORDINGS:-/nonexistent}
        target: /recordings
        bind:
          create_host_path: false
    restart: "no"
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_recorder/health', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 30

  storm-spike:
    image: vigil/storm-spike:local
    container_name: storm-spike
    profiles: ["spike"]
    user: "0"
    environment:
      VIGIL_LAB_PROFILE: ${VIGIL_LAB_PROFILE:-test}
      VIGIL_LOCAL_UID: ${VIGIL_LOCAL_UID:-10001}
      VIGIL_LOCAL_GID: ${VIGIL_LOCAL_GID:-10001}
    networks: [lab-net]
    volumes:
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/vigil-app
        target: /run/secrets/vigil-app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/demo-control
        target: /run/secrets/demo-control
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../docs/31-demo-data
        target: /demo-data
        read_only: true
      - type: bind
        source: ${VIGIL_SPIKE_RESULTS:-../../spikes/results}
        target: /results
        bind:
          create_host_path: false
      - type: bind
        source: ${VIGIL_SPIKE_SAVE:-../../dev/fakes/recordings/monitoring}
        target: /save
        bind:
          create_host_path: false
    restart: "no"

  vigil-db:
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    container_name: vigil-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vigil
      POSTGRES_PASSWORD_FILE: /run/secrets/vigil/vigil-db-superuser
    networks: [vigil-net]
    volumes:
      - vigil-db-data:/var/lib/postgresql/data
      - type: bind
        source: ../db/init
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/vigil-db
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "vigil"]
      interval: 2s
      timeout: 2s
      retries: 60

  vigil-migrate:
    image: vigil/vigil-app:local
    container_name: vigil-migrate
    user: "10001"
    environment:
      SPRING_PROFILES_ACTIVE: migrate
    depends_on:
      vigil-db: {condition: service_healthy}
    networks: [vigil-net]
    volumes:
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/vigil-migrate
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  vigil-app:
    image: vigil/vigil-app:local
    container_name: vigil-app
    user: "10001"
    command:
      - --vigil.http.bind-address=0.0.0.0
      - --vigil.security.secure-cookies=false
      - --vigil.links.base=http://{host}:8080
    depends_on:
      vigil-migrate: {condition: service_completed_successfully}
    networks:
      vigil-net:
        aliases: [demo.vigil.test]
      lab-net:
        aliases: [demo.vigil.test]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/vigil-app
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
    restart: "no"

  jira-fake:
    image: vigil/dev-fakes:local
    container_name: jira-fake
    environment:
      FAKE_ROLE: jira
    networks:
      vigil-net:
        aliases: [jira.fakes]
      lab-net:
        aliases: [jira.fakes]
    restart: "no"
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_fakes/calls', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 30

  teams-fake:
    image: vigil/dev-fakes:local
    container_name: teams-fake
    environment:
      FAKE_ROLE: teams
    networks:
      vigil-net:
        aliases: [teams.fakes]
      lab-net:
        aliases: [teams.fakes]
    restart: "no"
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_fakes/calls', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 30

  claude-fake:
    image: vigil/dev-fakes:local
    container_name: claude-fake
    environment:
      FAKE_ROLE: claude
    networks:
      vigil-net:
        aliases: [claude.fakes]
      lab-net:
        aliases: [claude.fakes]
    restart: "no"
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_fakes/calls', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 30

  openai-fake:
    image: vigil/dev-fakes:local
    container_name: openai-fake
    environment:
      FAKE_ROLE: openai
    networks:
      vigil-net:
        aliases: [openai.fakes]
      lab-net:
        aliases: [openai.fakes]
    restart: "no"
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_fakes/calls', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 30

  ollama-llm-fake:
    image: vigil/dev-fakes:local
    container_name: ollama-llm-fake
    environment:
      FAKE_ROLE: ollama-llm
    networks:
      vigil-net:
        aliases: [ollama-llm.fakes]
      lab-net:
        aliases: [ollama-llm.fakes]
    restart: "no"
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/_fakes/calls', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 30

  ollama-embed-fake:
    image: vigil/dev-fakes:local
    container_name: ollama-embed-fake
    environment:
      FAKE_ROLE: ollama-embed
    networks:
      vigil-net:
        aliases: [ollama-embed.fakes]
      lab-net:
        aliases: [ollama-embed.fakes]
    restart: "no"
    healthcheck:
      test:
        - CMD
        - /usr/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/_fakes/calls', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    container_name: mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks:
      vigil-net:
        aliases: [mailpit]
      lab-net:
        aliases: [mailpit]
    restart: "no"

  vigil-embed:
    image: ollama/ollama:0.40.5@sha256:5d3a2f25f9825628daba94dc0b1d421c7d57d6c03ae5faa9ba050e058bab8241 # optional
    container_name: vigil-embed
    profiles: ["embed"]
    networks: [vigil-net]
    volumes:
      - vigil-embed-models:/root/.ollama
    restart: "no"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 60

  e2e:
    image: vigil/e2e:local
    container_name: e2e
    profiles: ["e2e"]
    user: "${VIGIL_LOCAL_UID:-10001}:${VIGIL_LOCAL_GID:-10001}"
    networks: [vigil-net]
    volumes:
      - type: bind
        source: ../../tests/e2e
        target: /e2e/tests
        read_only: true
      - type: bind
        source: ${VIGIL_LOCAL_E2E:-/nonexistent}
        target: /e2e/run
        bind:
          create_host_path: false
      - type: bind
        source: ${VIGIL_LOCAL_SECRETS:-/nonexistent}/e2e
        target: /run/secrets/vigil
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VIGIL_LOCAL_STATE:-/nonexistent}
        target: /run/state
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
