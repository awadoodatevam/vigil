spring.application.name=vigil-app
spring.threads.virtual.enabled=true
spring.config.import=optional:configtree:${VIGIL_SECRETS_DIR:/run/secrets/vigil}/
spring.datasource.url=jdbc:postgresql://${VIGIL_DB_HOST:vigil-db}:${VIGIL_DB_PORT:5432}/${VIGIL_DB_NAME:vigil}
spring.datasource.username=vigil_app
spring.datasource.password=${vigil-db-app}
spring.datasource.hikari.maximum-pool-size=20
spring.flyway.enabled=false
spring.modulith.events.jdbc.schema=platform
spring.modulith.events.jdbc.schema-initialization.enabled=false
spring.modulith.events.completion-mode=UPDATE
spring.modulith.events.republish-outstanding-events-on-restart=false
server.address=${vigil.http.bind-address:127.0.0.1}
server.forward-headers-strategy=native
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
logging.structured.format.console=ecs
spring.main.banner-mode=off
vigil.security.secure-cookies=true
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
