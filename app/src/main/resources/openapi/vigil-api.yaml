openapi: 3.1.0
info:
  title: vigil-api
  version: '1'
  description: Every operation can also answer 400 bad_request (a request the firewall or Spring MVC refuses), 500 internal_error, 503 dependency_failed and 503 starting (AR-I-03).
paths:
  /api/v1/public/branding:
    get:
      security: []
      responses:
        '200':
          description: The tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '404':
          description: unknown_host, or not_found when the tenant has no settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/public/logo:
    get:
      security: []
      responses:
        '200':
          description: The logo image
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        '404':
          description: not_found when the tenant has no logo, or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/session:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The user; sets the vigil_session and vigil_csrf cookies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: bad_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in, "Username or password is incorrect."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      security:
        - session: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      security:
        - session: []
      parameters:
        - name: X-Vigil-CSRF
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The session ended; both cookies are cleared
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden (missing or wrong CSRF header)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tenant:
    get:
      security:
        - session: []
      responses:
        '200':
          description: The tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/live:
    get:
      security:
        - session: []
      parameters:
        - name: topics
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server-Sent Events
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: bad_request (missing or invalid topics)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/tenants:
    post:
      security:
        - installation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTenant'
      responses:
        '200':
          description: The new tenant, in state provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
        '400':
          description: 'bad_request, also "name: 1 to 100 characters"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in (no or malformed bearer token) or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/tenants/{tenant_id}/seed-imports:
    post:
      security:
        - installation: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - bundle
              properties:
                bundle:
                  type: string
                  contentMediaType: application/zip
      responses:
        '202':
          description: The import started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedImportStarted'
        '400':
          description: bad_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found (no such tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: too_large (a file over 10 MiB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid (the bundle's problems) or refused (tenant_not_new)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/seed-imports/{seed_import_id}:
    get:
      security:
        - installation: []
      parameters:
        - name: seed_import_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The seed import record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedImport'
        '400':
          description: bad_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/aliases/{host_name}:
    put:
      security:
        - installation: []
      parameters:
        - name: host_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasSet'
      responses:
        '200':
          description: The new alias revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alias'
        '400':
          description: bad_request (also a host name that is not valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found (no such tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: refused, tenant_not_ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/webhooks/{source_key}:
    post:
      security:
        - webhook: []
      parameters:
        - name: source_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: The monitoring source's message, any media type, at most 5 MiB (AR-TM-02); stored exactly as received
        content:
          '*/*':
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: The call was stored; the number of alert entries the connector found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEntries'
        '401':
          description: not_signed_in (no or malformed bearer token) or bad_token (not the source's token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found (no active source with this key), or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: too_large (a body over 5 MiB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vigil_session
    installation:
      type: http
      scheme: bearer
    webhook:
      type: http
      scheme: bearer
  schemas:
    WebhookEntries:
      type: object
      additionalProperties: false
      required:
        - entries
      properties:
        entries:
          type: integer
          minimum: 0
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorContent'
    ErrorContent:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - bad_request
            - session_ended
            - not_signed_in
            - bad_token
            - forbidden
            - not_found
            - unknown_host
            - conflict
            - too_large
            - refused
            - invalid
            - internal_error
            - dependency_failed
            - starting
        message:
          type: string
        details:
          type: object
    User:
      type: object
      additionalProperties: false
      required:
        - username
        - display_name
        - permissions
        - team_keys
      properties:
        username:
          type: string
        display_name:
          type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - view
              - acknowledge
              - approve_action
              - manage_setup
              - manage_routing
              - manage_ai_settings
              - rerun_ai_investigation
              - edit_workflow
              - run_test_replay
              - publish_workflow
        team_keys:
          type: array
          items:
            type: string
    TenantSettings:
      type: object
      additionalProperties: false
      required:
        - product_display_name
        - customer_name
        - has_logo
        - environment_label
      properties:
        product_display_name:
          type: string
        customer_name:
          type: string
        has_logo:
          type: boolean
        environment_label:
          type:
            - string
            - 'null'
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    NewTenant:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    AliasSet:
      type: object
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
          format: uuid
    TenantCreated:
      type: object
      additionalProperties: false
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
          format: uuid
    SeedImportStarted:
      type: object
      additionalProperties: false
      required:
        - seed_import_id
      properties:
        seed_import_id:
          type: string
          format: uuid
    SeedImport:
      type: object
      additionalProperties: false
      required:
        - seed_import_id
        - tenant_id
        - bundle_name
        - bundle_version
        - state
        - started_at
        - finished_at
        - parts
      properties:
        seed_import_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        bundle_name:
          type: string
        bundle_version:
          type: string
        state:
          type: string
          enum:
            - running
            - succeeded
            - failed
        started_at:
          type: string
        finished_at:
          type:
            - string
            - 'null'
        parts:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - module
              - outcome
              - counts
              - error
            properties:
              module:
                type: string
              outcome:
                type: string
                enum:
                  - succeeded
                  - failed
                  - not_started
              counts:
                type: object
                additionalProperties:
                  type: integer
              error:
                type:
                  - string
                  - 'null'
    Alias:
      type: object
      additionalProperties: false
      required:
        - host_name
        - revision
        - tenant_id
        - set_at
      properties:
        host_name:
          type: string
        revision:
          type: integer
        tenant_id:
          type: string
          format: uuid
        set_at:
          type: string
