openapi: 3.1.0
info:
  title: vigil-api
  version: '1'
  description: Every operation can also answer 400 bad_request (a request the firewall or Spring MVC refuses), 500 internal_error, 503 dependency_failed and 503 starting (AR-I-03).
paths:
  /api/v1/public/branding:
    get:
      security: []
      responses:
        '200':
          description: The tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '404':
          description: unknown_host, or not_found when the tenant has no settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/public/logo:
    get:
      security: []
      responses:
        '200':
          description: The logo image
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        '404':
          description: not_found when the tenant has no logo, or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/session:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The user; sets the vigil_session and vigil_csrf cookies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: bad_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in, "Username or password is incorrect."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      security:
        - session: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      security:
        - session: []
      parameters:
        - name: X-Vigil-CSRF
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The session ended; both cookies are cleared
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden (missing or wrong CSRF header)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tenant:
    get:
      security:
        - session: []
      responses:
        '200':
          description: The tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/live:
    get:
      security:
        - session: []
      parameters:
        - name: topics
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server-Sent Events
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: bad_request (missing or invalid topics)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/tenants:
    post:
      security:
        - installation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTenant'
      responses:
        '200':
          description: The new tenant, in state provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
        '400':
          description: 'bad_request, also "name: 1 to 100 characters"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in (no or malformed bearer token) or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/tenants/{tenant_id}/seed-imports:
    post:
      security:
        - installation: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - bundle
              properties:
                bundle:
                  type: string
                  contentMediaType: application/zip
      responses:
        '202':
          description: The import started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedImportStarted'
        '400':
          description: bad_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found (no such tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: too_large (a file over 10 MiB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid (the bundle's problems) or refused (tenant_not_new)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/seed-imports/{seed_import_id}:
    get:
      security:
        - installation: []
      parameters:
        - name: seed_import_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The seed import record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedImport'
        '400':
          description: bad_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/aliases/{host_name}:
    put:
      security:
        - installation: []
      parameters:
        - name: host_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasSet'
      responses:
        '200':
          description: The new alias revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alias'
        '400':
          description: bad_request (also a host name that is not valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found (no such tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: refused, tenant_not_ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/webhooks/{source_key}:
    post:
      security:
        - webhook: []
      parameters:
        - name: source_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: The monitoring source's message, any media type, at most 5 MiB (AR-TM-02); stored exactly as received
        content:
          '*/*':
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: The call was stored; the number of alert entries the connector found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEntries'
        '401':
          description: not_signed_in (no or malformed bearer token) or bad_token (not the source's token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found (no active source with this key), or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: too_large (a body over 5 MiB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alerts/strip:
    get:
      security:
        - session: []
      responses:
        '200':
          description: The incoming alerts strip (DC-S02-02)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStrip'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents:
    get:
      security:
        - session: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of the incident list (DC-S02-04)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPage'
        '400':
          description: bad_request (limit or after not valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The header, hypothesis and impact, or the incident it was merged into
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IncidentHeader'
                  - $ref: '#/components/schemas/MergedIncident'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/alerts:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The member alerts by type (DC-S03-05)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentAlerts'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/evidence:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The evidence entries (DC-S03-08)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceLines'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/run:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The latest live run, or null (DC-S03-06, DC-S03-07, DC-S03-12)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestRun'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/timeline:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The timeline, newest first (DC-S03-13)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentTimeline'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/notified-teams:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The notified teams (DC-S03-14)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifiedTeams'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/investigation:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The AI investigation section (DC-S03-09)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationSection'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/response:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The Response section of the latest live run (DC-S03-10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseSection'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/recovery:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The recovery verifications of the latest live run (DC-S03-11)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverySection'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/acknowledgement:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The Acknowledge page (DC-S04)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgePage'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/acknowledgements:
    post:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The acknowledgement (DC-S04-04)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewAcknowledgement'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: refused with the refusal of DC-S04-05
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/approval-requests/{request_id}:
    get:
      security:
        - session: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The Approval page (DC-S05)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPage'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/approval-requests/{request_id}/decisions:
    post:
      security:
        - session: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '201':
          description: The decision (DC-S05-05)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewDecision'
        '400':
          description: bad_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: refused with the refusal of DC-S05-06
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/dashboard:
    get:
      security:
        - session: []
      responses:
        '200':
          description: The dashboard (DC-S10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vigil_session
    installation:
      type: http
      scheme: bearer
    webhook:
      type: http
      scheme: bearer
  schemas:
    WebhookEntries:
      type: object
      additionalProperties: false
      required:
        - entries
      properties:
        entries:
          type: integer
          minimum: 0
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorContent'
    ErrorContent:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - bad_request
            - session_ended
            - not_signed_in
            - bad_token
