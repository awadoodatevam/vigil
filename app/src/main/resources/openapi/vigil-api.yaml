openapi: 3.1.0
info:
  title: vigil-api
  version: '1'
  description: Every operation can also answer 400 bad_request (a request the firewall or Spring MVC refuses), 500 internal_error, 503 dependency_failed and 503 starting (AR-I-03).
paths:
  /api/v1/public/branding:
    get:
      security: []
      responses:
        '200':
          description: The tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '404':
          description: unknown_host, or not_found when the tenant has no settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/public/logo:
    get:
      security: []
      responses:
        '200':
          description: The logo image
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        '404':
          description: not_found when the tenant has no logo, or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/session:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The user; sets the vigil_session and vigil_csrf cookies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: bad_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in, "Username or password is incorrect."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      security:
        - session: []
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      security:
        - session: []
      parameters:
        - name: X-Vigil-CSRF
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The session ended; both cookies are cleared
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden (missing or wrong CSRF header)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tenant:
    get:
      security:
        - session: []
      responses:
        '200':
          description: The tenant settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/live:
    get:
      security:
        - session: []
      parameters:
        - name: topics
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server-Sent Events
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: bad_request (missing or invalid topics)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/tenants:
    post:
      security:
        - installation: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTenant'
      responses:
        '200':
          description: The new tenant, in state provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
        '400':
          description: 'bad_request, also "name: 1 to 100 characters"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in (no or malformed bearer token) or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/tenants/{tenant_id}/seed-imports:
    post:
      security:
        - installation: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - bundle
              properties:
                bundle:
                  type: string
                  contentMediaType: application/zip
      responses:
        '202':
          description: The import started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedImportStarted'
        '400':
          description: bad_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found (no such tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: too_large (a file over 10 MiB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: invalid (the bundle's problems) or refused (tenant_not_new)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/seed-imports/{seed_import_id}:
    get:
      security:
        - installation: []
      parameters:
        - name: seed_import_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The seed import record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeedImport'
        '400':
          description: bad_request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/installation/aliases/{host_name}:
    put:
      security:
        - installation: []
      parameters:
        - name: host_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasSet'
      responses:
        '200':
          description: The new alias revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alias'
        '400':
          description: bad_request (also a host name that is not valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: not_signed_in or bad_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found (no such tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: refused, tenant_not_ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/webhooks/{source_key}:
    post:
      security:
        - webhook: []
      parameters:
        - name: source_key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        description: The monitoring source's message, any media type, at most 5 MiB (AR-TM-02); stored exactly as received
        content:
          '*/*':
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: The call was stored; the number of alert entries the connector found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEntries'
        '401':
          description: not_signed_in (no or malformed bearer token) or bad_token (not the source's token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found (no active source with this key), or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: too_large (a body over 5 MiB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/alerts/strip:
    get:
      security:
        - session: []
      responses:
        '200':
          description: The incoming alerts strip (DC-S02-02)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStrip'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents:
    get:
      security:
        - session: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A page of the incident list (DC-S02-04)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPage'
        '400':
          description: bad_request (limit or after not valid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The header, hypothesis and impact, or the incident it was merged into
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IncidentHeader'
                  - $ref: '#/components/schemas/MergedIncident'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/alerts:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The member alerts by type (DC-S03-05)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentAlerts'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/evidence:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The evidence entries (DC-S03-08)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceLines'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/run:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The latest live run, or null (DC-S03-06, DC-S03-07, DC-S03-12)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestRun'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/timeline:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The timeline, newest first (DC-S03-13)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentTimeline'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/incidents/{incident_id}/notified-teams:
    get:
      security:
        - session: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The notified teams (DC-S03-14)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifiedTeams'
        '401':
          description: session_ended or not_signed_in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: not_found or unknown_host
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vigil_session
    installation:
      type: http
      scheme: bearer
    webhook:
      type: http
      scheme: bearer
  schemas:
    WebhookEntries:
      type: object
      additionalProperties: false
      required:
        - entries
      properties:
        entries:
          type: integer
          minimum: 0
    Error:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorContent'
    ErrorContent:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - bad_request
            - session_ended
            - not_signed_in
            - bad_token
            - forbidden
            - not_found
            - unknown_host
            - conflict
            - too_large
            - refused
            - invalid
            - internal_error
            - dependency_failed
            - starting
        message:
          type: string
        details:
          type: object
    User:
      type: object
      additionalProperties: false
      required:
        - username
        - display_name
        - permissions
        - team_keys
      properties:
        username:
          type: string
        display_name:
          type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - view
              - acknowledge
              - approve_action
              - manage_setup
              - manage_routing
              - manage_ai_settings
              - rerun_ai_investigation
              - edit_workflow
              - run_test_replay
              - publish_workflow
        team_keys:
          type: array
          items:
            type: string
    TenantSettings:
      type: object
      additionalProperties: false
      required:
        - product_display_name
        - customer_name
        - has_logo
        - environment_label
      properties:
        product_display_name:
          type: string
        customer_name:
          type: string
        has_logo:
          type: boolean
        environment_label:
          type:
            - string
            - 'null'
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    NewTenant:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    AliasSet:
      type: object
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
          format: uuid
    TenantCreated:
      type: object
      additionalProperties: false
      required:
        - tenant_id
      properties:
        tenant_id:
          type: string
          format: uuid
    SeedImportStarted:
      type: object
      additionalProperties: false
      required:
        - seed_import_id
      properties:
        seed_import_id:
          type: string
          format: uuid
    SeedImport:
      type: object
      additionalProperties: false
      required:
        - seed_import_id
        - tenant_id
        - bundle_name
        - bundle_version
        - state
        - started_at
        - finished_at
        - parts
      properties:
        seed_import_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        bundle_name:
          type: string
        bundle_version:
          type: string
        state:
          type: string
          enum:
            - running
            - succeeded
            - failed
        started_at:
          type: string
        finished_at:
          type:
            - string
            - 'null'
        parts:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - module
              - outcome
              - counts
              - error
            properties:
              module:
                type: string
              outcome:
                type: string
                enum:
                  - succeeded
                  - failed
                  - not_started
              counts:
                type: object
                additionalProperties:
                  type: integer
              error:
                type:
                  - string
                  - 'null'
    Alias:
      type: object
      additionalProperties: false
      required:
        - host_name
        - revision
        - tenant_id
        - set_at
      properties:
        host_name:
          type: string
        revision:
          type: integer
        tenant_id:
          type: string
          format: uuid
        set_at:
          type: string
    TeamName:
      type: object
      additionalProperties: false
      required:
        - team_key
        - name
      properties:
        team_key:
          type: string
        name:
          type: string
    UserName:
      type: object
      additionalProperties: false
      required:
        - user_id
        - display_name
      properties:
        user_id:
          type: string
        display_name:
          type: string
    ActorName:
      type: object
      additionalProperties: false
      required:
        - kind
        - user_id
        - display_name
      properties:
        kind:
          type: string
          enum:
            - user
            - module
        user_id:
          type:
            - string
            - 'null'
        display_name:
          type:
            - string
            - 'null'
    ComponentName:
      type: object
      additionalProperties: false
      required:
        - component_key
        - name
      properties:
        component_key:
          type: string
        name:
          type: string
    AlertStrip:
      type: object
      additionalProperties: false
      required:
        - received_last_10_minutes
        - forming
        - sources
        - latest
      properties:
        received_last_10_minutes:
          type: integer
        forming:
          type: object
          additionalProperties: false
          required:
            - incidents
            - alerts
          properties:
            incidents:
              type: integer
            alerts:
              type: integer
        sources:
          type: object
          additionalProperties: false
          required:
            - healthy
            - total
            - not_healthy
          properties:
            healthy:
              type: integer
            total:
              type: integer
            not_healthy:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - source_key
                  - name
                  - health
                properties:
                  source_key:
                    type: string
                  name:
                    type: string
                  health:
                    type: string
                    enum:
                      - stale
                      - disconnected
        latest:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - alert_id
              - first_received_at
              - source_kind
              - alert_type_name
              - title
            properties:
              alert_id:
                type: string
              first_received_at:
                type: string
              source_kind:
                type: string
                enum:
                  - zabbix
                  - alertmanager
              alert_type_name:
                type: string
              title:
                type: string
    Acknowledged:
      type:
        - object
        - 'null'
      additionalProperties: false
      required:
        - user
        - at
      properties:
        user:
          $ref: '#/components/schemas/UserName'
        at:
          type: string
    Ticket:
      type:
        - object
        - 'null'
      additionalProperties: false
      required:
        - key
        - url
      properties:
        key:
          type: string
        url:
          type: string
    IncidentRow:
      type: object
      additionalProperties: false
      required:
        - incident_id
        - number
        - title
        - severity
        - state
        - stage
        - owner
        - acknowledged
        - alert_count
        - first_alert_fired_at
        - ticket
      properties:
        incident_id:
          type: string
        number:
          type: integer
        title:
          type: string
        severity:
          type:
            - string
            - 'null'
          enum:
            - P1
            - P2
            - P3
            - P4
            - null
        state:
          type: string
          enum:
            - open
            - resolved
            - closed
        stage:
          type:
            - string
            - 'null'
          enum:
            - investigation
            - response
            - recovery
