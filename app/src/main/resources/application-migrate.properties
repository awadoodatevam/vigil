spring.main.web-application-type=none
spring.datasource.username=vigil_owner
spring.datasource.password=${vigil-db-owner}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=audit,tenancy,identity,connectors,runner,servicemap,intake,ai_gateway,knowledge,incidents,investigation,notifications,ticketing,routing,correlation,recovery,diagnostics,actions,engine,workflows,reporting,setup,platform
spring.flyway.default-schema=platform
spring.flyway.create-schemas=true
spring.flyway.connect-retries=30
spring.flyway.connect-retries-interval=2s
