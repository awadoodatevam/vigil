<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo control panel</title>
    <style>
      @font-face {
        font-family: "Inter Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url("/fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "JetBrains Mono Variable";
        font-style: normal;
        font-display: swap;
        font-weight: 100 800;
        src: url("/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* The tokens this page uses, with the names and values of web/src/app/tokens.css (VD-R-15). */
      :root {
        --vd-gray-0: #ffffff;
        --vd-gray-25: #f8fafc;
        --vd-gray-50: #f1f4f8;
        --vd-gray-100: #e6eaf0;
        --vd-gray-200: #d5dbe4;
        --vd-gray-500: #647083;
        --vd-gray-600: #4a5567;
        --vd-gray-700: #353f4f;
        --vd-gray-900: #141a23;
        --vd-text: var(--vd-gray-900);
        --vd-text-2: var(--vd-gray-600);
        --vd-canvas: var(--vd-gray-50);
        --vd-surface: var(--vd-gray-0);
        --vd-border: var(--vd-gray-200);
        --vd-border-2: var(--vd-gray-100);
        --vd-navy-900: #0b1526;
        --vd-on-navy: #ffffff;
        --vd-accent-500: #2f6fed;
        --vd-accent-600: #1f5ad6;
        --vd-accent-700: #1846ab;
        --vd-red-50: #fdecec;
        --vd-red-200: #f6c7c3;
        --vd-red-600: #d92d20;
        --vd-red-700: #b42318;
        --vd-orange-700: #b54708;
        --vd-warning: var(--vd-orange-700);
        --vd-font: "Inter Variable", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --vd-mono: "JetBrains Mono Variable", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --vd-size-13: 13px;
        --vd-size-14: 14px;
        --vd-size-15: 15px;
        --vd-size-16: 16px;
        --vd-space-1: 4px;
        --vd-space-3: 12px;
        --vd-space-4: 16px;
        --vd-space-5: 20px;
        --vd-space-6: 24px;
        --vd-radius-sm: 6px;
        --vd-radius: 10px;
        --vd-radius-lg: 14px;
        --vd-shadow-1: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
        --vd-shadow-2: 0 8px 24px rgba(16, 24, 40, 0.1), 0 2px 6px rgba(16, 24, 40, 0.06);
        --vd-focus-ring: 0 0 0 2px var(--vd-gray-0), 0 0 0 4px var(--vd-accent-500);
        --vd-fast: 120ms ease-out;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      /* VD-S-09: the page, the body role (45-visual-design Section 5). */
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        font-family: var(--vd-font);
        font-size: var(--vd-size-15);
        line-height: 1.45;
        font-weight: 400;
        color: var(--vd-text);
        background: var(--vd-canvas);
        -webkit-font-smoothing: antialiased;
      }
      /* VD-C-29 top line. */
      #top {
        margin: 0;
        width: 100%;
        padding: var(--vd-space-3) var(--vd-space-6);
        font-size: var(--vd-size-14);
        font-weight: 600;
        color: var(--vd-on-navy);
        background: var(--vd-navy-900);
        overflow-wrap: anywhere;
      }
      main {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: var(--vd-space-6);
      }
      /* VD-C-04 card. */
      .card,
      #buttons {
        background: var(--vd-surface);
        border: 1px solid var(--vd-border);
        border-radius: var(--vd-radius);
        box-shadow: var(--vd-shadow-1);
      }
      /* VD-C-29 login: a card with VD-C-10 fields, the primary button and the error notice. */
      .login-card {
        width: 100%;
        max-width: 424px;
        margin: var(--vd-space-4) auto 0;
        padding: 28px;
        border-radius: var(--vd-radius-lg);
        box-shadow: var(--vd-shadow-2);
      }
      #login-form {
        display: flex;
        flex-direction: column;
      }
      #login-form label {
        margin: 0 0 6px;
        font-size: var(--vd-size-13);
        font-weight: 600;
        color: var(--vd-gray-700);
      }
      #login-form input + label {
        margin-top: var(--vd-space-4);
      }
      #login-form input {
        width: 100%;
        padding: 10px var(--vd-space-3);
        font: inherit;
        font-size: var(--vd-size-15);
        font-weight: 400;
        color: var(--vd-text);
        background: var(--vd-surface);
        border: 1px solid var(--vd-gray-500);
        border-radius: var(--vd-radius-sm);
      }
      #login-form input:focus {
        border-color: var(--vd-accent-500);
      }
      /* VD-C-09 buttons. */
      button {
        padding: 9px var(--vd-space-4);
        font: inherit;
        font-size: var(--vd-size-14);
        font-weight: 600;
        border: 1px solid transparent;
        border-radius: var(--vd-radius-sm);
        cursor: pointer;
        transition:
          background var(--vd-fast),
          border-color var(--vd-fast);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #login-form button {
        width: 100%;
        margin-top: var(--vd-space-5);
        color: #ffffff;
        background: var(--vd-accent-500);
        border-color: var(--vd-accent-500);
      }
      #login-form button:hover {
        background: var(--vd-accent-600);
        border-color: var(--vd-accent-600);
      }
      #buttons button,
      #confirm-cancel {
        color: var(--vd-text);
        background: var(--vd-surface);
        border-color: var(--vd-border);
        box-shadow: var(--vd-shadow-1);
      }
      #buttons button:hover:enabled,
      #confirm-cancel:hover {
        background: var(--vd-gray-25);
      }
      #confirm-reset {
        color: #ffffff;
        background: var(--vd-red-600);
      }
      /* VD-C-11 error notice: the login refusal, not shown while empty. */
      #login-error {
        margin: var(--vd-space-3) 0 0;
        padding: var(--vd-space-3) 14px;
        font-size: var(--vd-size-14);
        color: var(--vd-red-700);
        background: var(--vd-red-50);
        border: 1px solid var(--vd-red-200);
        border-radius: var(--vd-radius-sm);
        overflow-wrap: anywhere;
      }
      #login-error:empty {
        display: none;
      }
      /* VD-C-29 buttons card. */
      #buttons {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #buttons li {
        padding: 14px var(--vd-space-5);
      }
      #buttons li + li {
        border-top: 1px solid var(--vd-border-2);
      }
      .description {
        margin: 6px 0 0;
        font-size: var(--vd-size-14);
        line-height: 20px;
        color: var(--vd-text-2);
        overflow-wrap: anywhere;
      }
      .reason {
        margin: var(--vd-space-1) 0 0;
        font-size: var(--vd-size-13);
        font-weight: 600;
        color: var(--vd-warning);
        overflow-wrap: anywhere;
      }
      /* VD-C-29 state card. */
      .state-card {
        margin-top: var(--vd-space-4);
        padding: var(--vd-space-4) var(--vd-space-5);
      }
      #faults p {
        margin: 0;
        font-size: var(--vd-size-14);
        line-height: 20px;
        color: var(--vd-text);
        overflow-wrap: anywhere;
      }
      #faults p + p {
        margin-top: var(--vd-space-1);
      }
      #faults p:first-child {
        font-weight: 600;
      }
      #status {
        margin: var(--vd-space-3) 0 0;
        padding-top: var(--vd-space-3);
        border-top: 1px solid var(--vd-border-2);
        font-size: var(--vd-size-15);
        font-weight: 600;
        color: var(--vd-text);
        overflow-wrap: anywhere;
      }
      #clock {
        margin: 6px 0 0;
        font-family: var(--vd-mono);
        font-size: var(--vd-size-15);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--vd-accent-700);
        overflow-wrap: anywhere;
      }
      .state-card > p:last-child {
        margin: var(--vd-space-3) 0 0;
      }
      /* VD-C-08 link at 15px weight 600. */
      #open {
        font-size: var(--vd-size-15);
        font-weight: 600;
        color: var(--vd-accent-600);
        text-decoration: none;
      }
      #open:hover,
      #open:focus-visible {
        text-decoration: underline;
      }
      /* VD-C-27 confirmation dialog. */
      #confirm {
        width: calc(100% - 32px);
        max-width: 400px;
        margin: auto;
        padding: var(--vd-space-5);
        color: var(--vd-text);
        background: var(--vd-surface);
        border: none;
        border-radius: var(--vd-radius-lg);
        box-shadow: var(--vd-shadow-2);
      }
      #confirm::backdrop {
        background: rgba(11, 21, 38, 0.5);
      }
      #confirm > p {
        margin: 0 0 var(--vd-space-4);
        font-size: 17px;
        line-height: 24px;
        font-weight: 600;
        color: var(--vd-text);
      }
      .confirm-buttons {
        display: flex;
        gap: var(--vd-space-3);
      }
      .confirm-buttons button {
        flex: 1;
        min-height: 48px;
        font-size: var(--vd-size-16);
      }
      /* VD-R-12 focus ring. */
      :is(a, button, input):focus-visible {
        outline: none;
        box-shadow: var(--vd-focus-ring) !important;
      }
      @media (max-width: 599px) {
        #top {
          padding: var(--vd-space-3) var(--vd-space-4);
        }
        main {
          padding: var(--vd-space-4);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <p id="top"></p>
    <main>
      <section id="login" hidden>
        <div class="card login-card">
          <form id="login-form">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" />
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
            <button type="submit">Sign in</button>
            <p id="login-error"></p>
          </form>
        </div>
      </section>
      <section id="panel" hidden>
        <ul id="buttons"></ul>
        <div class="card state-card">
          <div id="faults"></div>
          <p id="status"></p>
          <p id="clock" hidden></p>
          <p><a id="open" target="_blank" rel="noopener noreferrer"></a></p>
        </div>
      </section>
    </main>
    <dialog id="confirm">
      <p>Reset now? This ends the current demo run.</p>
      <div class="confirm-buttons">
        <button type="button" id="confirm-cancel">Cancel</button>
        <button type="button" id="confirm-reset">Reset</button>
      </div>
    </dialog>
    <script>
      "use strict";
      const elements = {};
      const reasons = {};
      let built = false;

      function byId(id) {
        return document.getElementById(id);
      }

      function setTop(product) {
        byId("top").textContent = "Demo control panel — demo-only, not part of " + product + ".";
      }

      function showLogin() {
        byId("panel").hidden = true;
        byId("login").hidden = false;
      }

      function two(value) {
        return String(value).padStart(2, "0");
      }

      function clockTime(iso) {
        const time = new Date(iso);
        return two(time.getHours()) + ":" + two(time.getMinutes()) + ":" + two(time.getSeconds());
      }

      function build(state) {
        const list = byId("buttons");
        for (const button of state.buttons) {
          const item = document.createElement("li");
          const element = document.createElement("button");
          element.type = "button";
          element.addEventListener("click", () => press(button.key));
          const description = document.createElement("p");
          description.className = "description";
          const reason = document.createElement("p");
          reason.className = "reason";
          item.append(element, description, reason);
          list.append(item);
          elements[button.key] = { element, description, reason };
        }
        built = true;
      }

      function render(state) {
        setTop(state.product);
        byId("login").hidden = true;
        byId("panel").hidden = false;
        if (!built) {
          build(state);
        }
        for (const button of state.buttons) {
          const parts = elements[button.key];
          parts.element.textContent = button.label;
          parts.description.textContent = button.description;
          const reason = reasons[button.key] ?? button.refused;
          parts.reason.textContent = reason ?? "";
          parts.reason.hidden = reason == null;
          parts.element.disabled = !state.connected || button.refused != null;
        }
        const faults = byId("faults");
        const status = byId("status");
        if (!state.connected) {
          faults.replaceChildren(line("Connecting…"));
          status.textContent = "Connecting…";
          status.hidden = true;
        } else {
          const lines = [line("Active faults:")];
          if (state.active.length === 0) {
            lines.push(line("No active faults."));
          }
          for (const fault of state.active) {
            lines.push(line(fault.fault + " " + fault.name + " since " + clockTime(fault.since)));
          }
          faults.replaceChildren(...lines);
          status.textContent = state.status;
          status.hidden = false;
        }
        const clock = byId("clock");
        clock.textContent = state.storm_clock ?? "";
        clock.hidden = state.storm_clock == null;
        const open = byId("open");
        open.textContent = "Open " + state.product;
        open.href = state.vigil_url + "/login";
      }

      function line(text) {
        const element = document.createElement("p");
        element.textContent = text;
        return element;
      }

      async function refresh() {
        let response;
        try {
          response = await fetch("/api/state", { cache: "no-store" });
        } catch {
          return;
        }
        const body = await response.json().catch(() => ({}));
        for (const key of Object.keys(reasons)) {
          delete reasons[key];
        }
        if (response.status === 401) {
          if (body.product) {
            setTop(body.product);
          }
          showLogin();
        } else if (response.ok) {
          render(body);
        }
      }

      async function press(key) {
        if (key === "reset") {
          const dialog = byId("confirm");
          dialog.showModal();
          byId("confirm-cancel").focus();
          return;
        }
        await send(key);
      }

      async function send(key) {
        const response = await fetch("/api/buttons/" + key, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        if (response.status === 409) {
          const body = await response.json();
          reasons[key] = body.reason;
          const parts = elements[key];
          parts.reason.textContent = body.reason;
          parts.reason.hidden = false;
        } else if (response.status === 401) {
          showLogin();
        }
      }

      byId("confirm-cancel").addEventListener("click", () => byId("confirm").close());
      byId("confirm-reset").addEventListener("click", () => {
        byId("confirm").close();
        send("reset");
      });

      byId("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const response = await fetch("/api/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: byId("username").value,
            password: byId("password").value,
          }),
        });
        if (response.status === 204) {
          byId("login-error").textContent = "";
          byId("password").value = "";
          await refresh();
        } else if (response.status === 401) {
          byId("login-error").textContent = "Username or password is incorrect.";
        }
      });

      refresh();
      setInterval(refresh, 1000);
    </script>
  </body>
</html>
