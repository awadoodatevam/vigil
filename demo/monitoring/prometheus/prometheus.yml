# Prometheus of the lab (AR-U-10, AR-X-02; DD-F-10 monitoring_configuration.prometheus; P-04 spec Section 6.2.5).
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/lab-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [lab-alertmanager:9093]
      basic_auth:
        username: vigil
        password_file: /run/secrets/vigil/alertmanager-password

scrape_configs:
  - job_name: lab-db-node
    static_configs:
      - targets: [lab-db-01:9100]
  - job_name: lab-api
    honor_labels: true
    static_configs:
      - targets: [lab-api-01:9200]
  - job_name: lab-vas
    static_configs:
      - targets: [lab-vas-01:9200]
  - job_name: lab-probe
    static_configs:
      - targets: [lab-probe-01:9200]
